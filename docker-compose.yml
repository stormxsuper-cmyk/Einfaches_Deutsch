services:
  db:
    image: postgres:15-alpine
    container_name: ed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
      POSTGRES_DB: einfaches_deutsch
    ports:
      - "5432:5432"
    volumes:
      - ed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d einfaches_deutsch"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local_dev_password_change_me}@db:5432/einfaches_deutsch
      FRONTEND_ORIGIN: http://localhost:3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    volumes:
      - ./database:/database:ro
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  ed_pgdata:
